<!doctype html>
<html lang="bg">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <title>Карта на населението на България - 2025 г.</title>
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
        <style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}
body {
    display: flex;
    flex-direction: column;
}
.map-title-bar {
    width: 100%;
    flex-shrink: 0;
    box-sizing: border-box;
    padding: 10px 14px;
    font: bold 19px/1.3 Arial, Helvetica, sans-serif;
    color: #1a1a1a;
    background: #f7f7f7;
    border: 1px solid #ddd;
    border-bottom: none;
}
.map-title-bar .subtitle {
    font: normal 12px/1.3 Arial, Helvetica, sans-serif;
    color: #666;
    margin-top: 2px;
}
#map {
    width: 100%;
    flex: 1;
    min-height: 0;
}
.info.legend {
    background: rgba(255,255,255,0.92);
    border-radius: 6px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.4);
    font: 13px/1.4 Arial, Helvetica, sans-serif;
    color: #222;
    max-width: 220px;
    overflow: hidden;
}
.legend-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    cursor: pointer;
    user-select: none;
    font-weight: bold;
    font-size: 13px;
}
.legend-toggle .arrow {
    transition: transform 0.15s ease;
    font-size: 11px;
    margin-left: 8px;
}
.info.legend.collapsed .legend-toggle .arrow {
    transform: rotate(-90deg);
}
.legend-body {
    padding: 0 12px 10px;
    max-height: 500px;
    transition: max-height 0.15s ease;
}
.info.legend.collapsed .legend-body {
    max-height: 0;
    padding-top: 0;
    padding-bottom: 0;
    overflow: hidden;
}
.info.legend h4 {
    margin: 0 0 6px;
    font-size: 13px;
    font-weight: bold;
}
.legend-section + .legend-section {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid #ddd;
}
.legend-row {
    display: flex;
    align-items: center;
    margin-bottom: 3px;
}
.legend-swatch {
    width: 16px;
    height: 16px;
    margin-right: 6px;
    border: 1px solid rgba(35,35,35,0.6);
    flex-shrink: 0;
}
.legend-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    margin-right: 6px;
    border: 1px solid rgba(35,35,35,0.6);
    flex-shrink: 0;
}
.pie-marker {
    border-radius: 50%;
    border: 1px solid rgba(35,35,35,0.75);
    box-shadow: 0 0 2px rgba(0,0,0,0.5);
}
.popup-title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 4px;
}
.popup-table td {
    padding: 1px 4px;
}
.popup-table td.label {
    color: #555;
}
.popup-bar-wrap {
    width: 140px;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    background: #de77ae;
    margin-top: 2px;
}
.popup-bar-men {
    height: 8px;
    background: #3182bd;
}
.popup-note {
    margin-top: 6px;
    font-size: 11px;
    color: #555;
    font-style: italic;
}
        </style>
        <title>Население на България по области — 2025</title>
    </head>
    <body>
        <div class="map-title-bar">
            Население на България по области — 2025
            <div class="subtitle">Обща численост, разпределение по пол и гъстота на населението &middot; данни: НСИ</div>
        </div>
        <div id="map"></div>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="leaflet-hash.js"></script>
        <script src="data_embed.js"></script>
        <script>

        if (typeof OBLASTI === 'undefined') {
            document.getElementById('map').innerHTML = '<div style="padding:40px;font:16px Arial;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;margin:20px;">' +
                '<b>Грешка:</b> Данните за картата не са заредени (<code>data_embed.js</code>).<br><br>' +
                'Качи и двата файла: index.html и data_embed.js в една папка.' +
                '</div>';
            throw new Error('OBLASTI is undefined');
        }

        var map = L.map('map', { zoomControl: false, maxZoom: 18, minZoom: 6 })
            .fitBounds([[41.15, 22.28], [44.28, 28.68]]);
        var hash = new L.Hash(map);

        L.control.zoom({ position: 'topleft' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap, &copy; CARTO',
            maxZoom: 19
        }).addTo(map);

        map.attributionControl.setPrefix('Данни: НСИ &middot; <a href="https://leafletjs.com">Leaflet</a>');

        // ---- PuBu quantile choropleth by density ----
        var densityBreaks = [16.3, 19.3, 21.2, 23.7, 27.1, 30.9, 36.4, 50.2];
        var densityColors = [
            '#fff7fb', '#ece7f2', '#d0d1e6', '#a6bddb',
            '#74a9cf', '#3690c0', '#0570b0', '#045a8d', '#023858'
        ];
        function densityColor(d) {
            for (var i = 0; i < densityBreaks.length; i++) {
                if (d <= densityBreaks[i]) return densityColors[i];
            }
            return densityColors[densityColors.length - 1];
        }
        function style__0(feature) {
            return {
                weight: 1,
                color: '#4d4d4d',
                fillColor: densityColor(feature.properties.density),
                fillOpacity: 0.85
            };
        }

        var fmt = function(n) { return n.toLocaleString('bg-BG'); };

        function pop__0(feature, layer) {
            var p = feature.properties;
            var total = p.total, men = p.men, women = p.women;
            var menPct = total ? Math.round((men / total) * 100) : 0;
            var womenPct = 100 - menPct;
            var dominant = women > men ? 'жени' : (men > women ? 'мъже' : 'равен брой');
            var diff = Math.abs(women - men);
            var name = p.name.split(' (')[0];
            var popupContent =
                '<div class="popup-title">' + name + '</div>' +
                '<table class="popup-table">' +
                    '<tr><td class="label">Общо население:</td><td><b>' + fmt(total) + '</b></td></tr>' +
                    '<tr><td class="label">Мъже:</td><td>' + fmt(men) + ' (' + menPct + '%)</td></tr>' +
                    '<tr><td class="label">Жени:</td><td>' + fmt(women) + ' (' + womenPct + '%)</td></tr>' +
                    '<tr><td class="label">Площ:</td><td>' + fmt(p.area_km2) + ' km²</td></tr>' +
                    '<tr><td class="label">Средна гъстота:</td><td>' + p.density + ' души/km²</td></tr>' +
                '</table>' +
                '<div class="popup-bar-wrap"><div class="popup-bar-men" style="width:' + menPct + '%"></div></div>' +
                '<div class="popup-note">Доминират <b>' + dominant + '</b> — с ' + fmt(diff) + ' души повече.</div>';
            layer.bindPopup(popupContent, { maxHeight: 400 });
        }

        var layer__0 = L.geoJson(OBLASTI, {
            interactive: true,
            onEachFeature: pop__0,
            style: style__0
        }).addTo(map);

        // ---- Диаграми (кръгови - мъже/жени) за всяка област ----
        var MEN_COLOR = '#3182bd';
        var WOMEN_COLOR = '#de77ae';
        var pieMinRadius = 6, pieMaxRadius = 16;
        var totals = OBLASTI.features.map(function(f) { return f.properties.total; });
        var minTotal = Math.min.apply(null, totals);
        var maxTotal = Math.max.apply(null, totals);

        function pieRadius(total) {
            if (maxTotal === minTotal) return (pieMinRadius + pieMaxRadius) / 2;
            var t = (total - minTotal) / (maxTotal - minTotal);
            return pieMinRadius + Math.sqrt(t) * (pieMaxRadius - pieMinRadius);
        }

        function pieIcon(men, women, radius) {
            var total = men + women;
            var menPct = total ? (men / total * 100) : 50;
            var size = radius * 2;
            var html = '<div class="pie-marker" style="width:' + size + 'px;height:' + size + 'px;' +
                'background:conic-gradient(' + MEN_COLOR + ' 0% ' + menPct + '%, ' + WOMEN_COLOR + ' ' + menPct + '% 100%);"></div>';
            return L.divIcon({
                className: '',
                html: html,
                iconSize: [size, size],
                iconAnchor: [size / 2, size / 2]
            });
        }

        var diagramLayer = L.layerGroup([]);
        layer__0.eachLayer(function(featLayer) {
            var p = featLayer.feature.properties;
            var center = featLayer.getBounds().getCenter();
            var marker = L.marker(center, {
                icon: pieIcon(p.men, p.women, pieRadius(p.total)),
                interactive: true,
                zIndexOffset: 1000
            });
            pop__0(featLayer.feature, marker);
            diagramLayer.addLayer(marker);
        });
        diagramLayer.addTo(map);

        // ---- Легенда ----
        var densityClasses = [
            { range: 'до 16.3', color: densityColors[0] },
            { range: '16.3 – 19.3', color: densityColors[1] },
            { range: '19.3 – 21.2', color: densityColors[2] },
            { range: '21.2 – 23.7', color: densityColors[3] },
            { range: '23.7 – 27.1', color: densityColors[4] },
            { range: '27.1 – 30.9', color: densityColors[5] },
            { range: '30.9 – 36.4', color: densityColors[6] },
            { range: '36.4 – 50.2', color: densityColors[7] },
            { range: 'над 50.2', color: densityColors[8] }
        ];

        var legend = L.control({ position: 'bottomright' });
        legend.onAdd = function() {
            var div = L.DomUtil.create('div', 'info legend');
            var body = '<div class="legend-section">';
            body += '<h4>Гъстота на населението</h4>';
            body += '<div style="font-size:11px;color:#555;margin-bottom:4px;">души / km²</div>';
            densityClasses.forEach(function(c) {
                body += '<div class="legend-row"><span class="legend-swatch" style="background:' + c.color + '"></span>' + c.range + '</div>';
            });
            body += '</div>';
            body += '<div class="legend-section">';
            body += '<h4>Диаграма: пол</h4>';
            body += '<div class="legend-row"><span class="legend-dot" style="background:' + MEN_COLOR + '"></span>Мъже</div>';
            body += '<div class="legend-row"><span class="legend-dot" style="background:' + WOMEN_COLOR + '"></span>Жени</div>';
            body += '<div style="font-size:11px;color:#555;margin-top:2px;">размерът на кръга = общо население</div>';
            body += '</div>';
            div.innerHTML =
                '<div class="legend-toggle">Легенда<span class="arrow">▼</span></div>' +
                '<div class="legend-body">' + body + '</div>';
            L.DomEvent.disableClickPropagation(div);
            div.querySelector('.legend-toggle').addEventListener('click', function() {
                div.classList.toggle('collapsed');
            });
            return div;
        };
        legend.addTo(map);

        </script>
    </body>
</html>
