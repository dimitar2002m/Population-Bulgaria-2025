<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Население на България по области — 2025 г.</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --paper:#f2ede3;
    --ink:#2c2620;
    --clay:#a1462f;
    --clay-dark:#7d3423;
    --slate:#3f5a5c;
    --gold:#c8934f;
    --line:#d8cfba;
    --men:#3f6f76;
    --women:#a1462f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:'Georgia', 'Iowan Old Style', serif;background:var(--paper);color:var(--ink);}
  #map{position:absolute;inset:0;}

  .site-header{
    position:absolute; top:0; left:0; right:0; z-index:1200;
    display:flex; align-items:baseline; gap:14px;
    padding:14px 20px; pointer-events:none;
  }
  .site-header h1{
    font-size:20px; letter-spacing:.04em; margin:0;
    font-weight:700; color:var(--ink);
    background:rgba(242,237,227,.92); padding:8px 14px;
    border:1px solid var(--line); pointer-events:auto;
  }
  .site-header .subtitle{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--slate); background:rgba(242,237,227,.92);
    padding:8px 12px; border:1px solid var(--line); pointer-events:auto;
    align-self:center;
  }

  .leaflet-popup-content-wrapper{
    background:var(--paper); color:var(--ink);
    border-radius:2px; border:1px solid var(--line);
    box-shadow:0 6px 18px rgba(44,38,32,.25);
  }
  .leaflet-popup-tip{background:var(--paper); border:1px solid var(--line);}
  .leaflet-popup-content{margin:0; width:290px !important; font-family:'Helvetica Neue', Arial, sans-serif;}

  .pop-card{padding:14px 16px 16px;}
  .pop-card h3{
    font-family:'Georgia', serif; font-size:17px; margin:0 0 2px;
    color:var(--clay-dark); font-weight:700;
  }
  .pop-card .region{
    font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--slate); margin:0 0 10px;
  }
  .pop-card .divider{border:none; border-top:1px solid var(--line); margin:10px 0;}

  .stat-row{display:flex; justify-content:space-between; align-items:baseline; font-size:12px; margin-bottom:3px;}
  .stat-row .label{color:#6b6357;}
  .stat-row .value{font-weight:700; font-variant-numeric:tabular-nums;}

  .block-label{
    font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--slate); margin:12px 0 5px;
  }

  .bar-track{background:#e6ddc9; height:9px; border-radius:0; position:relative; overflow:hidden; border:1px solid var(--line);}
  .bar-fill{background:var(--gold); height:100%;}
  .bar-caption{display:flex; justify-content:space-between; font-size:10px; color:#6b6357; margin-top:3px;}

  .density-gauge{position:relative; height:9px; background:#e6ddc9; border:1px solid var(--line); margin-top:2px;}
  .density-mark{position:absolute; top:-3px; width:2px; height:15px; background:var(--ink);}
  .density-fill{position:absolute; top:0; left:0; bottom:0; background:var(--slate);}

  .gender-bar{display:flex; height:22px; border:1px solid var(--line); overflow:hidden; margin-top:6px;}
  .gender-men{background:var(--men);}
  .gender-women{background:var(--women);}
  .gender-labels{display:flex; justify-content:space-between; font-size:11px; margin-top:4px; font-weight:600;}
  .gender-labels .men-l{color:var(--men);}
  .gender-labels .women-l{color:var(--women);}
  .dominant-note{
    margin-top:8px; font-size:11px; font-style:italic; color:var(--ink);
    background:#e9e1cd; padding:6px 8px; border-left:3px solid var(--gold);
  }

  .leaflet-control-layers{
    font-family:'Helvetica Neue', Arial, sans-serif; font-size:12px;
    background:var(--paper); border:1px solid var(--line); border-radius:2px;
    color:var(--ink);
  }

  .legend{
    background:rgba(242,237,227,.95); padding:10px 12px; border:1px solid var(--line);
    font-family:'Helvetica Neue', Arial, sans-serif; font-size:11px; color:var(--ink);
    line-height:1.5; max-width:190px;
  }
  .legend .legend-title{font-weight:700; letter-spacing:.05em; text-transform:uppercase; font-size:10px; margin-bottom:6px; color:var(--slate);}
  .legend .swatch{display:inline-block; width:12px; height:12px; margin-right:6px; vertical-align:middle; border:1px solid rgba(0,0,0,.2);}
</style>
</head>
<body>

<div class="site-header">
  <h1>Население на България — 2025</h1>
  <div class="subtitle">по области · geopeace.bg</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data_embed.js"></script>
<script>
const fmt = n => n.toLocaleString('bg-BG');

// ---- National aggregates (computed from the dataset) ----
const totals = OBLASTI.features.reduce((acc,f)=>{
  const p=f.properties;
  acc.pop+=p.total; acc.men+=p.men; acc.women+=p.women; acc.area+=p.area_km2;
  acc.maxPop=Math.max(acc.maxPop,p.total);
  acc.maxDensity=Math.max(acc.maxDensity,p.density);
  acc.minDensity=Math.min(acc.minDensity,p.density);
  return acc;
}, {pop:0,men:0,women:0,area:0,maxPop:0,maxDensity:0,minDensity:Infinity});
const avgDensity = totals.pop/totals.area;

// ---- Color ramps ----
function densityColor(d){
  // sequential clay ramp, quantile-ish breaks tuned to BG oblast densities
  return d > 200 ? '#7d3423' :
         d > 80  ? '#a1462f' :
         d > 40  ? '#c8934f' :
         d > 25  ? '#d9b98a' :
                    '#e9dfc9';
}
function genderColor(pctWomen){
  // diverging around 50% (in this dataset women >=50% everywhere,
  // ramp shows the *margin* of dominance)
  return pctWomen > 53 ? '#7d3423' :
         pctWomen > 51.5 ? '#a1462f' :
         pctWomen > 50.5 ? '#c48a68' :
                            '#d9b8a4';
}

function styleDensity(f){
  return {color:'#2c2620', weight:1, fillColor:densityColor(f.properties.density), fillOpacity:.85};
}
function styleGender(f){
  const p=f.properties;
  const pctWomen = 100*p.women/p.total;
  return {color:'#2c2620', weight:1, fillColor:genderColor(pctWomen), fillOpacity:.85};
}

function popupHTML(p){
  const pctOfMax = Math.round(100*p.total/totals.maxPop);
  const densityPct = Math.min(100, Math.round(100*p.density/totals.maxDensity));
  const densityVsAvg = p.density >= avgDensity ? 'над средната' : 'под средната';
  const pctMen = 100*p.men/p.total;
  const pctWomen = 100*p.women/p.total;
  const menBarPct = pctMen.toFixed(1);
  const womenBarPct = pctWomen.toFixed(1);
  const dominant = p.women > p.men ? 'жени' : (p.men > p.women ? 'мъже' : 'равен брой');
  const diff = Math.abs(p.women - p.men);
  const diffPct = Math.abs(pctWomen-pctMen).toFixed(1);

  return `
  <div class="pop-card">
    <h3>${p.name.split(' (')[0]}</h3>
    <p class="region">Област · EKATTE ${p.dist_code}</p>

    <div class="stat-row"><span class="label">Население</span><span class="value">${fmt(p.total)}</span></div>
    <div class="stat-row"><span class="label">Площ</span><span class="value">${fmt(p.area_km2)} км²</span></div>

    <div class="block-label">Дял от най-населената област (София-град)</div>
    <div class="bar-track"><div class="bar-fill" style="width:${pctOfMax}%"></div></div>
    <div class="bar-caption"><span>${pctOfMax}% от ${fmt(totals.maxPop)}</span></div>

    <div class="block-label">Гъстота на населението</div>
    <div class="density-gauge">
      <div class="density-fill" style="width:${densityPct}%"></div>
      <div class="density-mark" style="left:${Math.min(100,Math.round(100*avgDensity/totals.maxDensity))}%" title="средна за страната"></div>
    </div>
    <div class="bar-caption"><span>${p.density} души/км² — ${densityVsAvg} (${avgDensity.toFixed(1)} души/км² средно)</span></div>

    <hr class="divider">

    <div class="block-label">Разпределение по пол</div>
    <div class="gender-bar">
      <div class="gender-men" style="width:${menBarPct}%"></div>
      <div class="gender-women" style="width:${womenBarPct}%"></div>
    </div>
    <div class="gender-labels">
      <span class="men-l">Мъже ${fmt(p.men)} (${menBarPct}%)</span>
      <span class="women-l">Жени ${fmt(p.women)} (${womenBarPct}%)</span>
    </div>
    <div class="dominant-note">
      Доминират <strong>${dominant}</strong> — с ${fmt(diff)} души повече (${diffPct} пр.п. разлика).
    </div>
  </div>`;
}

const map = L.map('map', {zoomControl:false}).setView([42.75,25.2], 8);
L.control.zoom({position:'bottomright'}).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap, &copy; CARTO · Данни: НСИ',
  maxZoom: 18
}).addTo(map);

const densityLayer = L.geoJSON(OBLASTI, {
  style: styleDensity,
  onEachFeature: (f, layer) => {
    layer.bindPopup(popupHTML(f.properties));
    layer.on('mouseover', () => layer.setStyle({weight:2.5}));
    layer.on('mouseout', () => layer.setStyle({weight:1}));
  }
});

const genderLayer = L.geoJSON(OBLASTI, {
  style: styleGender,
  onEachFeature: (f, layer) => {
    layer.bindPopup(popupHTML(f.properties));
    layer.on('mouseover', () => layer.setStyle({weight:2.5}));
    layer.on('mouseout', () => layer.setStyle({weight:1}));
  }
});

densityLayer.addTo(map);

L.control.layers(
  {
    'Гъстота на населението': densityLayer,
    'Полово съотношение (доминиране на пола)': genderLayer
  },
  null,
  {collapsed:false, position:'topright'}
).addTo(map);

// ---- Legends that swap with the active layer ----
const legend = L.control({position:'bottomleft'});
legend.onAdd = function(){
  this._div = L.DomUtil.create('div','legend');
  this.update('density');
  return this._div;
};
legend.update = function(mode){
  if(mode==='density'){
    this._div.innerHTML = `
      <div class="legend-title">Гъстота (души/км²)</div>
      <div><span class="swatch" style="background:#e9dfc9"></span>&lt; 25</div>
      <div><span class="swatch" style="background:#d9b98a"></span>25–40</div>
      <div><span class="swatch" style="background:#c8934f"></span>40–80</div>
      <div><span class="swatch" style="background:#a1462f"></span>80–200</div>
      <div><span class="swatch" style="background:#7d3423"></span>&gt; 200</div>
      <div style="margin-top:6px; color:#6b6357;">Средно за страната: ${avgDensity.toFixed(1)} души/км²</div>`;
  } else {
    this._div.innerHTML = `
      <div class="legend-title">Дял на жените</div>
      <div><span class="swatch" style="background:#d9b8a4"></span>50–50.5%</div>
      <div><span class="swatch" style="background:#c48a68"></span>50.5–51.5%</div>
      <div><span class="swatch" style="background:#a1462f"></span>51.5–53%</div>
      <div><span class="swatch" style="background:#7d3423"></span>&gt; 53%</div>
      <div style="margin-top:6px; color:#6b6357;">Жените са мнозинство във всички области.</div>`;
  }
};
legend.addTo(map);

map.on('baselayerchange overlayadd', function(){});
map.on('layeradd', function(e){
  if(e.layer===genderLayer) legend.update('gender');
  if(e.layer===densityLayer) legend.update('density');
});
map.on('layerremove', function(e){
  if(map.hasLayer(genderLayer)) legend.update('gender');
  else if(map.hasLayer(densityLayer)) legend.update('density');
});
</script>
</body>
</html>
